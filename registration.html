    <main>

        <section class="section1">
            <h2>Make a Booking</h2>

            <p>
                Plan your next adventure in Lesotho.
                Complete the form below to book your visit.
            </p>
        </section>

        <section class="section1">

            <form id="bookingForm">

                <label>Full Name:</label><br>
                <input type="text" id="name" required>
                <br><br>

                <label>Email Address:</label><br>
                <input type="email" id="email" required>
                <br><br>

                <label>Phone Number:</label><br>
                <input type="tel" id="phone"
                pattern="[0-9+ ]{8,15}" required>
                <br><br>

                <label>Select Destination:</label><br>

                <select id="destination" required>
                    <option value="">Choose a destination</option>
                    <option value="Maletsunyane Falls">Maletsunyane Falls</option>
                    <option value="Katse Dam">Katse Dam</option>
                    <option value="Sehlabathebe National Park">Sehlabathebe National Park</option>
                    <option value="Thaba Bosiu">Thaba Bosiu</option>
                    <option value="Afriski Mountain Resort">Afriski Mountain Resort</option>
                    
                </select>

                <br><br>

                <label>Booking Date:</label><br>
                <input type="date" id="date" required>
                <br><br>

                <label>Number of Visitors:</label><br>
                <input type="number" id="visitors" min="1" max="50" required>
                <br><br>

                <label>Additional Information:</label><br>
                <textarea id="information"
                placeholder="Enter any additional information"></textarea>

                <br><br>

                <button type="button" onclick="calculateCost()">
                    Calculate Estimated Cost
                </button>

                <p id="cost"></p>

                <button type="submit">Submit Booking</button>

                <button type="reset">Reset</button>

            </form>

            <p id="bookingMessage"></p>

        </section>

    </main>

    <footer class="footer">
        <p>@2026 Explore Lesotho</p>
    </footer>


    <script>

        
            function calculateCost() {

            let visitors = Number(document.getElementById("visitors").value);

            if (visitors < 1 || visitors > 50 || !Number.isInteger(visitors)) {
                document.getElementById("cost").textContent =
                "Please enter between 1 and 50 visitors.";

                return;
            }

            let price = 600;

            let total = visitors * price;

            document.getElementById("cost").textContent =
            "Estimated Booking Cost: M" + total;

        }


        const form = document.getElementById("bookingForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            let bookingDate = document.getElementById("date").value;

            let today = new Date();
            today.setHours(0, 0, 0, 0);

            let selectedDate = new Date(bookingDate + "T00:00:00");

            if (selectedDate < today) {

                document.getElementById("bookingMessage").textContent =
                "Please select a future booking date.";

                document.getElementById("bookingMessage").style.color = "red";

                return;
            }

            document.getElementById("bookingMessage").textContent =
            "Thank you! Your booking request has been submitted successfully.";

            document.getElementById("bookingMessage").style.color = "green";

            form.reset();

            document.getElementById("cost").textContent = "";

        });

    </script>
